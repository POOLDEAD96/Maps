<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kazakhstan à Vélo — Carte Interactive</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="theme.css" />
</head>
<body>

<!-- ════════════════════════════════════════════════
     CONFIG
     Centré pour englober Almaty à l'est,
     Astana au nord et Aktau à l'ouest
     sur la Mer Caspienne. Zoom 5.
════════════════════════════════════════════════ -->
<script>
const CONFIG = {

  centre:     [47.5, 67.0],
  zoom:       5,
  zoomMobile: 4,

  tileUrl:         'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_47ar_1_fcd9cee437f87004e164ce8c',
  tileAttribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',

  /* Contour du pays */
  contour:       'contour_kazakhstan.json',
  contourColor:  '#250598',
  contourWeight: 2,

  pois: 'pois.json',

  header: {
    titre:     { fr: "Kazakhstan à Vélo",                                en: "Kazakhstan by Bike"                             },
    soustitre: { fr: "Carte interactive des étapes & points d'intérêt",  en: "Interactive map of stages & points of interest" },
    droite:    { fr: "🚴 Almaty · Astana · Caspienne",                  en: "🚴 Almaty · Astana · Caspian Sea"              }
  },

  /* ⚠️ Couleurs en hex direct — pas de var(--...) */
  categories: [
    { id: 'etape',    color: '#0098B4', label: { fr: 'Étapes',          en: 'Stages'         } },
    { id: 'pratique', color: '#C8A000', label: { fr: 'Infos pratiques', en: 'Practical info' } },
    { id: 'culture',  color: '#005A78', label: { fr: 'Culture',         en: 'Culture'        } },
    { id: 'nature',   color: '#C8600A', label: { fr: 'Nature',          en: 'Nature'         } },
    { id: 'frontiere',color: '#3A3A3A', label: { fr: 'Frontière',       en: 'Border'         } }
  ]
};
</script>

<header id="header">
  <h1>
    <div id="header-titre"></div>
    <span id="header-soustitre"></span>
  </h1>
  <div id="header-right"></div>
</header>

<div id="filters">
  <button class="filter-btn active" data-cat="all">Tout afficher</button>
  <button class="filter-btn" data-cat="etape">🏠</button>
  <button class="filter-btn" data-cat="pratique">🛠️</button>
  <button class="filter-btn" data-cat="culture">🏛️</button>
  <button class="filter-btn" data-cat="nature">🏜️</button>
  <button class="filter-btn" data-cat="frontiere">🛂</button>
</div>

<div id="main">
  <div id="map"></div>
  <aside id="detail">
    <div id="detail-placeholder">
      <div class="big-emoji">🗺️</div>
      <p></p>
    </div>
    <div id="detail-content"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../carte.js"></script>

</body>
</html>
